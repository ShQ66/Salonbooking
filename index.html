<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نوبت‌دهی بدون سرور</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f5f2;--card:#fff;--tx:#1d1b19;--mu:#6b665f;--ac:#b4456b;--acx:#fff;--bd:#e3ded7;--ok:#1f8a5b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161413;--card:#201d1c;--tx:#f1ede8;--mu:#a29b93;--ac:#e0759b;--acx:#1a1214;--bd:#3a3532;--ok:#4cc38a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161413;--card:#201d1c;--tx:#f1ede8;--mu:#a29b93;--ac:#e0759b;--acx:#1a1214;--bd:#3a3532;--ok:#4cc38a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.7;font-size:15px}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 4px}h2{font-size:16px;margin:0 0 10px}
.mu{color:var(--mu);font-size:13px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
.r{display:flex;gap:8px}.r>*{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--acx);cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.4}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ch button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:6px 12px}
.ch button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--bd)}
.tabs{display:flex;gap:8px}
.ok{color:var(--ok)}
#qr{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:10px;width:max-content;margin:8px auto}
.lk{word-break:break-all;direction:ltr;text-align:left;font-size:11px;max-height:70px;overflow:auto;background:var(--bg);padding:6px;border-radius:8px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var S={name:"",phone:"",services:[],days:{}};
try{var sv=localStorage.getItem("bk");if(sv)S=JSON.parse(sv)}catch(e){}
var mode="admin",sel={s:null,d:null,t:null},app=document.getElementById("app");
function save(){try{localStorage.setItem("bk",JSON.stringify(S))}catch(e){}}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s))))}
function fd(d){return new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",month:"long",day:"numeric"}).format(new Date(d+"T12:00:00"))}
function fn(n){return Number(n).toLocaleString("fa-IR")}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var h=location.hash.slice(1);
if(h.length>10){try{S=dec(h);mode="cust"}catch(e){}}

function admin(){
 var sv=S.services.map(function(x,i){return '<div class="row"><span>'+esc(x.n)+' · '+fn(x.d)+' دقیقه · '+fn(x.pr)+' تومان</span><button class="g" onclick="delS('+i+')">حذف</button></div>'}).join("");
 var dk=Object.keys(S.days).sort();
 var dv=dk.map(function(d){return '<div><b>'+fd(d)+'</b><div class="ch">'+S.days[d].map(function(t){return '<button onclick="cl(\''+d+'\',\''+t+'\')">'+t+' ✕</button>'}).join("")+'</div></div>'}).join("")||'<p class="mu">هنوز ساعتی ساخته نشده.</p>';
 app.innerHTML='<h1>پنل سالن</h1><p class="mu">همه‌چیز فقط داخل مرورگر خودت ذخیره می‌شود.</p>'+
 '<div class="c"><h2>۱. اطلاعات</h2><input id="nm" placeholder="نام سالن" value="'+esc(S.name)+'"><input id="ph" inputmode="tel" placeholder="موبایل شما (مثلاً 09121234567)" value="'+esc(S.phone)+'" style="direction:ltr;text-align:right"></div>'+
 '<div class="c"><h2>۲. خدمات</h2>'+sv+'<input id="sn" placeholder="نام خدمت"><div class="r"><input id="sp" inputmode="numeric" placeholder="قیمت (تومان)"><input id="sd" inputmode="numeric" placeholder="مدت (دقیقه)"></div><button onclick="addS()">افزودن خدمت</button></div>'+
 '<div class="c"><h2>۳. ساعت‌های خالی</h2><div class="r"><div><span class="mu">شروع</span><input id="a" type="time" value="09:00"></div><div><span class="mu">پایان</span><input id="b" type="time" value="18:00"></div></div><div class="r"><div><span class="mu">فاصله (دقیقه)</span><input id="st" inputmode="numeric" value="60"></div><div><span class="mu">تعداد روز</span><input id="nd" inputmode="numeric" value="7"></div></div><label class="mu"><input type="checkbox" id="fr" checked style="width:auto"> جمعه‌ها تعطیل</label><br><button onclick="gen()" style="margin-top:8px">ساخت ساعت‌ها</button><div style="margin-top:10px">'+dv+'</div><p class="mu">روی هر ساعت بزنی بسته می‌شود (مثلاً وقتی نوبتش قطعی شد).</p></div>'+
 '<div class="c"><h2>۴. تست</h2><div class="tabs"><button onclick="prev()">پیش‌نمایش مشتری</button><button class="g" onclick="mk()">ساخت لینک و QR</button></div><div id="out"></div></div>';
 ["nm","ph"].forEach(function(i){$(i).oninput=function(){S.name=$("nm").value;S.phone=$("ph").value;save()}});
}
function addS(){var n=$("sn").value.trim();if(!n)return;S.services.push({n:n,pr:+$("sp").value||0,d:+$("sd").value||30});save();admin()}
function delS(i){S.services.splice(i,1);save();admin()}
function cl(d,t){S.days[d]=S.days[d].filter(function(x){return x!==t});if(!S.days[d].length)delete S.days[d];save();admin()}
function gen(){
 var a=$("a").value.split(":"),b=$("b").value.split(":"),st=+$("st").value||60,nd=+$("nd").value||7,fr=$("fr").checked;
 var s0=+a[0]*60+ +a[1],e0=+b[0]*60+ +b[1],days={},d=new Date();
 for(var i=0;i<nd;i++){
  var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  if(!(fr&&d.getDay()===5)){var ts=[];for(var m=s0;m+st<=e0;m+=st)ts.push(String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"));days[k]=ts}
  d.setDate(d.getDate()+1);
 }
 S.days=days;save();admin();
}
function mk(){
 var u=location.href.split("#")[0]+"#"+enc(S);
 $("out").innerHTML='<p class="mu">لینک مشتری (روی هاست خودت کار می‌کند):</p><div class="lk">'+esc(u)+'</div><button class="g" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+u+'\')">کپی لینک</button><div id="qr"></div><p class="mu" id="qm"></p>';
 try{new QRCode($("qr"),{text:u,width:170,height:170,correctLevel:QRCode.CorrectLevel.L})}catch(e){$("qr").style.display="none";$("qm").textContent="داده برای QR زیاد است؛ خدمات یا روزها را کمتر کن."}
}
function prev(){mode="cust";sel={s:null,d:null,t:null};cust(true)}
function cust(p){
 var dk=Object.keys(S.days||{}).sort();
 var msg=!S.services.length||!dk.length;
 app.innerHTML=(p?'<button class="g" onclick="mode=\'admin\';admin()">← بازگشت به پنل</button>':'')+'<h1>'+esc(S.name||"رزرو نوبت")+'</h1><p class="mu">خدمت و زمان را انتخاب کن، درخواستت برای سالن ارسال می‌شود.</p>'+
 (msg?'<div class="c">فعلاً چیزی برای رزرو تعریف نشده.</div>':
 '<div class="c"><h2>خدمت</h2><div class="ch">'+S.services.map(function(x,i){return '<button class="'+(sel.s===i?'on':'')+'" onclick="pick(\'s\','+i+')">'+esc(x.n)+' · '+fn(x.pr)+'</button>'}).join("")+'</div></div>'+
 '<div class="c"><h2>روز</h2><div class="ch">'+dk.map(function(d){return '<button class="'+(sel.d===d?'on':'')+'" onclick="pick(\'d\',\''+d+'\')">'+fd(d)+'</button>'}).join("")+'</div>'+
 (sel.d?'<h2 style="margin-top:12px">ساعت</h2><div class="ch">'+S.days[sel.d].map(function(t){return '<button class="'+(sel.t===t?'on':'')+'" onclick="pick(\'t\',\''+t+'\')">'+t+'</button>'}).join("")+'</div>':'')+'</div>'+
 '<div class="c"><input id="cn" placeholder="نام شما"><input id="cp" inputmode="tel" placeholder="موبایل شما" style="direction:ltr;text-align:right"><div class="r" style="margin-top:8px"><button id="b1" onclick="send(\'sms\')">پیامک</button><button id="b2" onclick="send(\'wa\')">واتس‌اپ</button><button class="g" id="b3" onclick="send(\'cp\')">کپی پیام</button></div><p class="mu" id="sm"></p></div>');
}
function pick(k,v){if(k==="d")sel.t=null;sel[k]=v;var n=$("cn")?$("cn").value:"",p=$("cp")?$("cp").value:"";cust(mode==="cust"&&location.hash.length<=10);if($("cn")){$("cn").value=n;$("cp").value=p}}
function send(t){
 var n=$("cn").value.trim(),p=$("cp").value.trim();
 if(sel.s===null||!sel.d||!sel.t||!n||!p){$("sm").textContent="خدمت، روز، ساعت، نام و موبایل را کامل کن.";return}
 var x=S.services[sel.s];
 var m="سلام، درخواست نوبت:\nخدمت: "+x.n+"\nتاریخ: "+fd(sel.d)+"\nساعت: "+sel.t+"\nنام: "+n+"\nموبایل: "+p;
 var ph=(S.phone||"").replace(/\D/g,"");
 if(t==="sms")location.href="sms:"+ph+"?body="+encodeURIComponent(m);
 else if(t==="wa")window.open("https://wa.me/98"+ph.replace(/^0/,"")+"?text="+encodeURIComponent(m),"_blank");
 else{try{navigator.clipboard.writeText(m);$("sm").textContent="پیام کپی شد؛ در روبیکا یا ایتا بفرست."}catch(e){$("sm").textContent=m}}
}
if(mode==="cust")cust(false);else admin();
</script>
</body>
</html>
