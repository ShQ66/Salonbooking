<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b4456b">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>نوبت‌دهی سالن</title>
<style>

:root[data-theme="dark"]{color-scheme:dark;--bg:#161413;--card:#201d1c;--tx:#f1ede8;--mu:#a29b93;--ac:#e0759b;--acx:#1a1214;--bd:#3a3532;--ok:#4cc38a;--er:#ff7b7b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.7;font-size:15px}
.w{max-width:600px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0}h2{font-size:16px;margin:0 0 8px}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.er{color:var(--er)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}

.r{display:flex;gap:8px}.r>*{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:9px 13px;background:var(--ac);color:var(--acx);cursor:pointer;margin:2px 0}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--er);border:1px solid var(--er)}
button.on{background:var(--ac);color:var(--acx)}
button:disabled{opacity:.4}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ch button{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.ch button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--bd)}
.row small{display:block;color:var(--mu)}
.ltr{direction:ltr;text-align:left;word-break:break-all;font-size:12px}
#qr svg{width:170px;height:170px}
#qr{display:flex;justify-content:center;padding:8px;background:#fff;border-radius:10px;width:max-content;margin:8px auto}
</style>
